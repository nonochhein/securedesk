name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  sonarcloud:
    name: sonarcloud
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage/
      - uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  dependency_audit:
    name: dependency_audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high

  secret_detection:
    name: secret_detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.29.1
          git --redact --verbose --exit-code 1
          --report-format json --report-path /repo/gitleaks-report.json /repo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 7

  container_build:
    name: container_build
    runs-on: ubuntu-latest
    needs: [lint, tests, sonarcloud, dependency_audit, secret_detection]
    steps:
      - uses: actions/checkout@v4
      - name: Définir IMAGE_TAG
        run: echo "IMAGE_TAG=securedesk:${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - run: docker build --pull --tag "$IMAGE_TAG" .
      - run: docker save "$IMAGE_TAG" --output securedesk-image.tar
      - uses: actions/upload-artifact@v4
        with:
          name: securedesk-image
          path: securedesk-image.tar
          retention-days: 1

  container_scan:
    name: container_scan
    runs-on: ubuntu-latest
    needs: container_build
    env:
      TRIVY_CACHE_DIR: .trivycache
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: securedesk-image
      - uses: actions/cache@v4
        with:
          path: .trivycache
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-
      - name: Rapport JSON
        run: >
          docker run --rm -v "$PWD:/work" -w /work -e TRIVY_CACHE_DIR
          aquasec/trivy:0.74.0 image --input securedesk-image.tar
          --format json --output trivy-report.json
      - name: Bloquer les critiques corrigibles
        run: >
          docker run --rm -v "$PWD:/work" -w /work -e TRIVY_CACHE_DIR
          aquasec/trivy:0.74.0 image --input securedesk-image.tar
          --severity CRITICAL --ignore-unfixed --exit-code 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-report.json
          retention-days: 7
